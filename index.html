<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Ethical Hacking Tool v3.0</title>
    <style>
        /* CSS Styling */
        :root {
            --primary-color: #0f0;
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #ff9800;
            --error-color: #f44336;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--primary-color);
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: #000;
            font-size: 14px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .scan-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .scan-btn:hover {
            background-color: var(--primary-color);
            color: #000;
            box-shadow: 0 0 15px var(--primary-color);
        }

        .scan-btn:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }

        .network-list {
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            background: #000;
            border: 1px solid #333;
        }

        .network-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #333;
            animation: fadeIn 0.5s ease-in-out;
        }

        .network-item:last-child {
            border-bottom: none;
        }

        .ssid {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 16px;
        }

        .signal {
            color: var(--accent-color);
            font-size: 14px;
        }

        .encryption {
            font-size: 12px;
            color: #888;
        }

        .footer {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #333;
            margin-top: 20px;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading::after {
            content: "...";
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60% { content: "..."; }
            80%, 100% { content: ""; }
        }

        .cracking-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        .cracking-text {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 300px;
            height: 20px;
            border: 2px solid var(--primary-color);
            padding: 2px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.1s linear;
        }

        .close-crack {
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--error-color);
            border: none;
            color: white;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Wi-Fi Hacker Pro v3.0</h1>
        </div>
        
        <div class="status-bar">
            <span id="interface">Wlan0: UP</span>
            <span id="mode">Monitor Mode: ON</span>
        </div>

        <button id="scanBtn" class="scan-btn" onclick="startScan()">Start Scan</button>

        <div id="networkList" class="network-list">
            <!-- Networks will appear here -->
            <div style="text-align: center; color: #555; padding: 20px;">No networks found. Click "Start Scan".</div>
        </div>

        <div class="footer">
            Simulated Ethical Hacking Interface | OSINT Tool
        </div>
    </div>

    <!-- Cracking Overlay -->
    <div id="crackOverlay" class="cracking-overlay">
        <div class="cracking-text" id="crackText">Cracking Password...</div>
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        <button id="closeCrackBtn" class="close-crack" onclick="closeCrack()">Close</button>
    </div>

    <script>
        // JavaScript Logic
        const scanBtn = document.getElementById('scanBtn');
        const networkList = document.getElementById('networkList');
        const crackOverlay = document.getElementById('crackOverlay');
        const progressFill = document.getElementById('progressFill');
        const closeCrackBtn = document.getElementById('closeCrackBtn');

        // Fake Network Data
        const fakeNetworks = [
            { ssid: "TP-Link_A3F2", signal: "-45 dBm", encryption: "WPA2" },
            { ssid: "Verizon_Fiber", signal: "-62 dBm", encryption: "WPA3" },
            { ssid: "XfinityWifi", signal: "-78 dBm", encryption: "Open" },
            { ssid: "NETGEAR_5G", signal: "-50 dBm", encryption: "WPA2" },
            { ssid: "Home_WiFi_01", signal: "-90 dBm", encryption: "WEP" },
            { ssid: "Starbucks_Free", signal: "-65 dBm", encryption: "Open" },
            { ssid: "iPhone_Hotspot", signal: "-40 dBm", encryption: "WPA2" },
            { ssid: "Office_Network", signal: "-72 dBm", encryption: "WPA2-Enterprise" },
            { ssid: "Linksys_A1B2", signal: "-85 dBm", encryption: "WPA" },
            { ssid: "Dell_4K", signal: "-60 dBm", encryption: "WPA2" }
        ];

        function startScan() {
            // Disable button
            scanBtn.disabled = true;
            scanBtn.innerText = "Scanning...";
            
            // Clear previous list
            networkList.innerHTML = '<div class="loading">Searching for networks...</div>';

            // Simulate delay
            setTimeout(() => {
                let htmlContent = '';
                
                // Shuffle and pick random networks for realism
                const shuffled = fakeNetworks.sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 6); // Show only 6 results

                selected.forEach(net => {
                    htmlContent += `
                        <div class="network-item">
                            <div>
                                <span class="ssid">${net.ssid}</span><br>
                                <span class="encryption">${net.encryption}</span>
                            </div>
                            <span class="signal">${net.signal}</span>
                        </div>
                    `;
                });

                networkList.innerHTML = htmlContent;
                
                // Re-enable button
                scanBtn.disabled = false;
                scanBtn.innerText = "Scan Again";
            }, 2000); // 2 seconds delay
        }

        function closeCrack() {
            crackOverlay.style.display = 'none';
        }
    </script>

</body>
</html>
